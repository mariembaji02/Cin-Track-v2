<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinéTrack</title>
    <link rel="icon"  type="image/svg+xml"  href="images/movie-icon.svg">
        <!-- link of tailwind css -->
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
      <!-- link of style sheet -->
       <link rel="stylesheet" href="style.css">
        <!-- font awsome link -->
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
      
</head>
<body class="min-h-screen  w-full">
                
                   <section class="modal hidden  fixed flex justify-center items-center top-0 left-0 h-full w-full z-1 bg-black/70 backdrop-blur-sm">
                    <!-- --------------------------------------------- -->
                    
                  <div id="modalAdd" class="hidden flex justify-center items-center lg:w-[70%] p-4">

                        <div class="bg-[#171525] border border-violet-500/30 rounded w-full max-w-6xl max-h-[95vh] overflow-y-auto shadow-2xl">

                            <!-- HEADER -->
                            <div class="flex justify-between items-center px-6 py-5 border-b border-violet-500/20">
                                <h2 class="text-white text-sm md:text-xl font-semibold ">
                                    🎬 Ajouter un film / série
                                </h2>

                                <button onclick="document.querySelector('.modal').classList.add('hidden');document.querySelector('#modalAdd').classList.add('hidden');"
                                    class="text-violet-300 text-3xl hover:text-white cursor-pointer">
                                    &times;
                                </button>
                            </div>


                            <!-- CONTENT -->
                            <form id="formAdd" class="grid grid-cols-1 md:grid-cols-[280px_1fr] gap-6 p-6">


                                <!-- LEFT : IMAGE -->
                                <div class="flex flex-col items-center gap-4">

                                    <!-- Poster preview -->
                                    <div class="w-fit aspect-[2/3] max-h-[500px] bg-[#211e35] border border-violet-500/30 rounded-xl overflow-hidden flex items-center justify-center">

                                        <img id="previewImage"
                                            src="images/defaultImage.png"
                                            alt="Poster"
                                            class="h-full  object-cover">

                                    </div>

                                    <!-- Image URL -->
                                     <input type="url" name="image"
                                    placeholder="URL de l'image"
                                    class="imagAjoter w-full bg-[#211e35] border border-violet-500/30 rounded-lg px-3 py-2 text-white text-sm outline-none focus:border-violet-500">
                                  <p class="imageError text-center text-sm mt-1  text-red-400"></p>
                                <p class="text-gray-500 text-xs">
                                    JPG, PNG
                                </p>

                                </div>


                                <!-- RIGHT : FORM FIELDS -->
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 content-start">


                                    <!-- TITLE -->
                                    <div>
                                        <label for="title" class="text-gray-300 text-sm block mb-2">
                                            Titre <span class="text-red-400">*</span>
                                        </label>

                                        <input type="text" id="title" name="title" 
                                            placeholder="Ex: Breaking Bad"
                                            class="w-full bg-[#211e35] border border-violet-500/30 rounded-lg px-3 py-3 text-white outline-none focus:border-violet-500">
                                           <p class="titleError text-center text-sm mt-1 text-red-400"></p>
                                          </div>


                                    <!-- TYPE -->
                                    <div>
                                        <label for="type" class="text-gray-300 text-sm block mb-2">
                                            Type <span class="text-red-400">*</span>
                                        </label>

                                        <select id="type" name="type"
                                            class="w-full bg-[#211e35] border border-violet-500/30 rounded-lg px-3 py-3 text-white outline-none focus:border-violet-500">

                                            <option value="" disabled selected>Choisir un type</option>
                                            <option value="movie">Film</option>
                                            <option value="series">Série</option>

                                        </select>
                                         <p class="typeError text-center text-sm mt-1  text-red-400"></p>
                                    </div>


                                    <!-- YEAR -->
                                      
                                    <div class="year">
                                        <label for="releaseYear" class="text-gray-300 text-sm block mb-2">
                                            Année de sortie <span class="text-red-400">*</span>
                                        </label>

                                        <input type="number" id="releaseYear" name="releaseYear" 
                                            placeholder="2010"
                                            class="w-full bg-[#211e35] border border-violet-500/30 rounded-lg px-3 py-3 text-white outline-none focus:border-violet-500">
                                          <p class="yearError text-center text-sm mt-1  text-red-400"></p>
                                    </div>
 

                                    <!-- SEASONS -->
                                    <div class="seasons">
                                        <label for="seasons" class="text-gray-300 text-sm block mb-2">
                                            Saisons (pour les séries)
                                        </label>

                                        <input type="number" id="seasons" name="seasons"
                                            placeholder=" le nombre des series ..."
                                            class="w-full bg-[#211e35] border border-violet-500/30 rounded-lg px-3 py-3 text-white outline-none focus:border-violet-500">
                                           <p class="seasonsError text-center text-sm mt-1  text-red-400"></p>
                                      </div>


                                    <!-- DURATION -->
                                    <div class="sm:col-span-2" id="duree">
                                        <label for="duration" class="text-gray-300 text-sm block mb-2">
                                            Durée (en min, pour les films)
                                        </label>

                                        <input type="number" id="duration" name="duration"
                                            placeholder="148"
                                            class="w-full bg-[#211e35] border border-violet-500/30 rounded-lg px-3 py-3 text-white outline-none focus:border-violet-500">
                                            <p class="durationError text-center text-sm mt-1  text-red-400"></p>
                                          </div>


                                    <!-- GENRES -->
                                    <div class="sm:col-span-2">
                                        <label for="genres" class="text-gray-300 text-sm block mb-2">
                                            Genres <span class="text-red-400">*</span>
                                        </label>

                                        <input type="text" id="genres" name="genres"
                                            placeholder="Drama, Crime, Thriller"
                                            class="w-full bg-[#211e35] border border-violet-500/30 rounded-lg px-3 py-3 text-white outline-none focus:border-violet-500">

                                        <p class="text-gray-500 text-xs mt-1">
                                            Séparer les genres par une virgule
                                        </p>
                                         <p class="genreError text-center text-sm mt-1  text-red-400"></p>
                                    </div>


                                    <!-- DIRECTORS -->
                                    <div class="sm:col-span-2">
                                        <label for="directors" class="text-gray-300 text-sm block mb-2">
                                            Réalisateur(s) <span class="text-red-400">*</span>
                                        </label>

                                        <input type="text" id="directors" name="directors" 
                                            placeholder="Vince Gilligan"
                                            class="w-full bg-[#211e35] border border-violet-500/30 rounded-lg px-3 py-3 text-white outline-none focus:border-violet-500">
                                           <p class="directorError text-center text-sm mt-1  text-red-400"></p>
                                          </div>


                                    <!-- COUNTRIES -->
                                    <div class="sm:col-span-2">
                                        <label for="productionCountries" class="text-gray-300 text-sm block mb-2">
                                            Pays de production <span class="text-red-400">*</span>
                                        </label>

                                        <input type="text" id="productionCountries" name="productionCountries" 
                                            placeholder="USA, UK"
                                            class="w-full bg-[#211e35] border border-violet-500/30 rounded-lg px-3 py-3 text-white outline-none focus:border-violet-500">
                                          <p class="countryError text-center text-sm mt-1  text-red-400"></p>
                                       </div>


                                    <!-- DESCRIPTION -->
                                    <div class="sm:col-span-2">
                                        <label for="description" class="text-gray-300 text-sm block mb-2">
                                            Description <span class="text-red-400">*</span>
                                        </label>

                                        <textarea id="description" name="description"  rows="3"
                                            placeholder="Description du film ou de la série..."
                                            class="w-full bg-[#211e35] border border-violet-500/30 rounded-lg px-3 py-3 text-white outline-none focus:border-violet-500 resize-y"></textarea>
                                           <p class="disError text-center text-sm mt-1  text-red-400"></p>
                                       </div>


                                    <!-- BUTTONS -->
                                    <div class="sm:col-span-2 flex justify-end gap-3 pt-4 border-t border-violet-500/20">

                                        <button type="button"
                                            onclick="document.querySelector('.modal').classList.add('hidden');document.querySelector('#modalAdd').classList.add('hidden');"
                                            class="px-5 py-3 rounded-lg border border-violet-500/30 text-gray-300 hover:bg-violet-500/10 transition">
                                            Annuler
                                        </button>

                                        <button type="submit"
                                            class="px-6 py-3 rounded-lg bg-violet-600 hover:bg-violet-700 text-white transition">
                                            <i class="fa-solid fa-plus mr-1"></i>
                                            Ajouter
                                        </button>
                                       
                                          
                                    </div>
                                     <p class="formError hidden text-center text-xl mt-1  text-red-400 bg-red-500/20 p-3 border border-red-600 rounded-lg col-span-2"></p>

                                </div>

                            </form>

                        </div>
                    </div>
                    <!-- ------------------------------------------------------ -->
                    <div id="modalEdit" class="hidden flex justify-center items-center lg:w-[70%] p-4">

                          <div class="bg-[#171525] border border-violet-500/30 rounded-2xl w-full max-w-6xl max-h-[95vh] overflow-y-auto shadow-2xl">
                              <!-- HEADER -->
                          <div class="flex justify-between items-center px-6 py-5 border-b border-violet-500/20">

                              <h2 class="text-white text-xl font-semibold flex items-center gap-3 cursor-pointer">
                                  <i class="fa-solid fa-clapperboard text-violet-400"></i>
                                  Modifier un film / série
                              </h2>

                              <button type="button"
                                  onclick="document.querySelector('.modal').classList.add('hidden');document.querySelector('#modalEdit').classList.add('hidden');"
                                  class="text-violet-300 text-3xl hover:text-white transition">
                                  &times;
                              </button>

                          </div>
                            <!-- CONTENT -->
        <form id="formEdit" class="grid grid-cols-1 md:grid-cols-[280px_1fr] gap-6 p-6">


            <!-- LEFT : POSTER -->
            <div class="flex flex-col items-center gap-4">

                <!-- Poster preview -->
                <div class="w-full aspect-[2/3] max-h-[500px] bg-[#211e35] border border-violet-500/30 rounded-xl overflow-hidden">

                    <img id="editPreviewImage"
                        src="https://image.tmdb.org/t/p/w500/oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg"
                        alt="Poster du film"
                        class="w-full h-full object-cover">
                     
                </div>


                <!-- Change image -->

                <input type="url" id="editImage" name="image"
                    placeholder="URL de l'image"
                    class="imagEdit w-full bg-[#211e35] border border-violet-500/30 rounded-lg px-3 py-2 text-white text-sm outline-none focus:border-violet-500">
                     <p class="imageErrorEdit text-center text-sm mt-1 text-red-400"></p>
                  
                <p class="text-gray-500 text-xs">
                    JPG, PNG
                </p>

            </div>


            <!-- RIGHT : FORM FIELDS -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 content-start">


                <!-- TITLE -->
                <div>
                    <label for="editTitle" class="text-gray-300 text-sm block mb-2">
                        Titre <span class="text-red-400">*</span>
                    </label>

                    <input type="text" id="editTitle" name="title" 
                        placeholder="Titre du film ou série"
                        class="w-full bg-[#211e35] border border-violet-500/30 rounded-lg px-3 py-3 text-white outline-none focus:border-violet-500">
                     <p class="titleErrorEdit text-center text-sm mt-1 text-red-400"></p>
                     
                   </div>


                <!-- TYPE -->
                <div>
                    <label for="editType" class="text-gray-300 text-sm block mb-2">
                        Type <span class="text-red-400">*</span>
                    </label>

                    <select id="editType" name="type" 
                        class="w-full bg-[#211e35] border border-violet-500/30 rounded-lg px-3 py-3 text-white outline-none focus:border-violet-500">

                        <option value="movie">Film</option>
                        <option value="series">Série</option>

                    </select>
                     <p class="typeErrorEdit text-center text-sm mt-1 text-red-400"></p>

                </div>


                <!-- YEAR -->
                <div class="yearEdit">
                    <label for="editReleaseYear" class="text-gray-300 text-sm block mb-2 ">
                        Année de sortie <span class="text-red-400">*</span>
                    </label>

                    <input type="number" id="editReleaseYear" name="releaseYear" 
                        placeholder="2010"
                        class="w-full bg-[#211e35] border border-violet-500/30 rounded-lg px-3 py-3 text-white outline-none focus:border-violet-500">
                     <p class="yearErrorEdit text-center text-sm mt-1 text-red-400"></p>
                      
                      </div>


                <!-- SEASONS -->
                <div class="seasonsEdit" >
                    <label for="editSeasons" class="labelS text-gray-300 text-sm block mb-2">
                        Saisons (pour les séries)
                    </label>

                    <input type="number" id="editSeasons" name="seasons"
                        placeholder=" Entrer le nombre des series ..."
                        class="w-full bg-[#211e35] border border-violet-500/30 rounded-lg px-3 py-3 text-white outline-none focus:border-violet-500">
                     <p class="seasonsErrorEdit text-center text-sm mt-1 text-red-400"></p>
                      
                      </div>


                <!-- DURATION -->
                <div class="sm:col-span-2" id="dureeEdit">
                    <label for="editDuration" class="labelD text-gray-300 text-sm block mb-2">
                        Durée (en min, pour les films)
                    </label>

                    <input type="number" id="editDuration" name="duration"
                        placeholder="148"
                        class="w-full bg-[#211e35] border border-violet-500/30 rounded-lg px-3 py-3 text-white outline-none focus:border-violet-500">
                     <p class="durationErrorEdit text-center text-sm mt-1 text-red-400"></p>
                    </div>


                <!-- GENRES -->
                <div class="sm:col-span-2">
                    <label for="editGenres" class="text-gray-300 text-sm block mb-2">
                        Genres <span class="text-red-400">*</span>
                    </label>

                    <input type="text" id="editGenres" name="genres" 
                        placeholder="Science Fiction, Action, Thriller"
                        class="w-full bg-[#211e35] border border-violet-500/30 rounded-lg px-3 py-3 text-white outline-none focus:border-violet-500">

                    <p class="text-gray-500 text-xs mt-1">
                        Séparer les genres par une virgule
                    </p>
                     <p class="genreErrorEdit text-center text-sm mt-1 text-red-400"></p>

                </div>


                <!-- DIRECTORS -->
                <div class="sm:col-span-2">
                    <label for="editDirectors" class="text-gray-300 text-sm block mb-2">
                        Réalisateur(s) <span class="text-red-400">*</span>
                    </label>

                    <input type="text" id="editDirectors" name="directors" 
                        placeholder="Christopher Nolan"
                        class="w-full bg-[#211e35] border border-violet-500/30 rounded-lg px-3 py-3 text-white outline-none focus:border-violet-500">
                     <p class="directorErrorEdit text-center text-sm mt-1 text-red-400"></p>
                      
                     </div>


                <!-- COUNTRIES -->
                <div class="sm:col-span-2">
                    <label for="editCountries" class="text-gray-300 text-sm block mb-2">
                        Pays de production <span class="text-red-400">*</span>
                    </label>

                    <input type="text" id="editCountries" name="productionCountries" 
                        placeholder="USA, UK"
                        class="w-full bg-[#211e35] border border-violet-500/30 rounded-lg px-3 py-3 text-white outline-none focus:border-violet-500">
                     <p class="countryErrorEdit text-center text-sm mt-1 text-red-400"></p>
                
                      </div>


                <!-- DESCRIPTION -->
                <div class="sm:col-span-2">
                    <label for="editDescription" class="text-gray-300 text-sm block mb-2">
                        Description <span class="text-red-400">*</span>
                    </label>

                    <textarea id="editDescription" name="description"  rows="4"
                        placeholder="Description du film ou de la série..."
                        class="w-full bg-[#211e35] border border-violet-500/30 rounded-lg px-3 py-3 text-white outline-none focus:border-violet-500 resize-y"></textarea>
                     <p class="disErrorEdit text-center text-sm mt-1 text-red-400"></p>
                </div>


                <!-- BUTTONS -->
                <div class="sm:col-span-2 flex justify-end gap-3 pt-4 border-t border-violet-500/20">

                    <!-- CANCEL -->
                    <button type="button"
                        onclick="document.querySelector('.modal').classList.add('hidden');document.querySelector('#modalEdit').classList.add('hidden');"
                        class="px-5 py-3 rounded-lg border border-violet-500/30 text-gray-300 hover:bg-violet-500/10 transition">

                        <i class="fa-solid fa-xmark mr-1"></i>
                        Annuler

                    </button>


                    <!-- SUBMIT -->
                    <button type="submit"
                        class="px-6 py-3 rounded-lg bg-violet-600 hover:bg-violet-700 text-white transition">

                        <i class="fa-solid fa-pen mr-1"></i>
                        Modifier

                    </button>
                    
                </div>
              <p class="formErrorEdit hidden text-center text-xl mt-1  text-red-400 bg-red-500/20 p-3 border border-red-600 rounded-lg col-span-2"></p>

                
            </div>

        </form>


                     
                           </div>    
                    </div>
                    <div class="Confirm bg-white hidden flex flex-col justify-center items-center gap-2  h-[30%]   w-[30%]  rounded-lg relative">
                        <p class="text-black text-3xl absolute top-2 right-6 cursor-pointer" onclick="document.querySelector('.modal').classList.add('hidden');document.querySelector('.Confirm').classList.add('hidden');">&times;</p>
                        <p class="title text-black font-semibold text-2xl"></p>
                        <p class="text-black ">bien supprimer </p>
                                 
                    </div>
                  </section>
                    
                        <div class=" min-h-screen  w-full">

                     <nav class="flex justify-between items-center w-[100%] p-1">
                        <header class=" flex  items-center gap-2  p-4 relative rounded-lg"> <img src="images/movie-icon.svg" alt="icon" class=" w-10 h-10"> <h1 class="text-xl font-semibold"> Ciné<span class="text-pink-700">Track</span></h1></header>

                          
                           <div class=" flex  items-center cursor-pointer">
                            <p class=" flex  items-center text-center  gap-1 px-3 py-3  text-md md:text-sm rounded-lg "><a href="index.html" class="flex gap-2 items-center "><span class="bg-[rgba(230,223,230,0.6)] p-1 rounded-xl"><img src="images/catalogu.svg" alt="catalogue" class="w-5 h-5"></span><span class="text-white" >Catalogue</span></a> </p>
                           </div>
                         </nav>
                       <main class="content  grid  ">
                         <section class="rounded p-2 border-[#854b85d3]  h-auto ">
                            <!-- dash board  -->
                            <div class="flex justify-between items-start ">
                                <h1 class="text-white text-2xl font-semibold ">Admin Space</h1>
                                <div class="bg-[rgba(162,88,184,0.49)] mt-2 flex gap-1 text-purple-300 p-2 rounded-xl"> <img src="images/date.svg" class="w-5" alt=""><span class="text-sm dateToday"></span></div>
                            </div>
                          
                         </section>
                         <section>
                            <!-- grid of movie -->
                              <div class="flex  justify-between items-center  p-3 rounded border border-violet-700/30   bg-[rgba(185,133,168,0.2)] m-2 h-20">
                                 <div class="flex items-center gap-1"><h2 class="font-bold text-lg"> Movies & Series </h2></div>
                                 <button class="bg-purple-300/50 cursor-pointer font-semibold text-md rounded p-1" onclick="document.querySelector('.modal').classList.remove('hidden');document.querySelector('#modalAdd').classList.remove('hidden');">+Ajouter</button>
                              </div>
                           <div class="gridMovies border w-[90%] border-violet-700/30 gap-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 lg:gap-2  p-4 w-full place-items-center">  
                                  
                              </div>
                         </section>
                    
                    
                        
                    
                           

                        </main>
                   
                   

                  </div>

                    <footer class="bg-black flex flex-col justify-center items-center h-20 mt-4 " >
                      <h1 class="text-xl flex justify-center  font-semibold"> <img src="images/movie-icon.svg" alt="icon" class="w-10 h-10"> <span class="text-white"> Ciné</span><span class="text-pink-700">Track</span></h1>
                      <p class="text-white text-center text-sm">2026 CinéTrack - plateform des movies</p>
                  </footer> 

                  
                  </section>
                


    <script type="module" src="js/admin.js"></script>    
</body>
</html>
